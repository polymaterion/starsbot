services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stars
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stars -d stars"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # баннеры можно менять без пересборки образа
      - ./assets/banners:/srv/assets/banners:ro
      # тексты (locales/*.json) тоже можно править без пересборки: достаточно перезапустить бот
      - ./locales:/srv/locales:ro

volumes:
  pgdata:
